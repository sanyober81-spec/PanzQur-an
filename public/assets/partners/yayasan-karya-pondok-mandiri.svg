<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="30%" stop-color="#D97706" />
      <stop offset="70%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Royal Blue Ring Gradient -->
    <linearGradient id="blueRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F2D6B" />
    </linearGradient>

    <!-- Sunburst / Inner Warm Gradient -->
    <radialGradient id="sunburstGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <!-- Circular Text Paths -->
    <path id="textArcTop" d="M 60,210 A 150,150 0 1,1 360,210" fill="none" />
    <path id="textArcBottom" d="M 360,210 A 150,150 0 0,1 60,210" fill="none" />
  </defs>

  <!-- Outer Gold Laurel Rim -->
  <circle cx="210" cy="210" r="202" fill="url(#goldRim)" />
  <circle cx="210" cy="210" r="192" fill="#0F2D6B" />

  <!-- Laurel Leaf Accents around outer edge -->
  <g stroke="url(#goldRim)" stroke-width="4" fill="none" opacity="0.95">
    <circle cx="210" cy="210" r="185" stroke-dasharray="6 8" />
  </g>

  <!-- Blue Ring with Official Typography -->
  <circle cx="210" cy="210" r="176" fill="url(#blueRing)" stroke="url(#goldRim)" stroke-width="4" />

  <!-- Curved Text: YAYASAN (Top) -->
  <text fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="8px">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      YAYASAN
    </textPath>
  </text>

  <!-- Curved Text: KARYA PONDOK MANDIRI (Bottom) -->
  <text fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="22" letter-spacing="3.5px">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      KARYA PONDOK MANDIRI
    </textPath>
  </text>

  <!-- Inner Gold Bezel & Field -->
  <circle cx="210" cy="210" r="124" fill="url(#goldRim)" />
  <circle cx="210" cy="210" r="118" fill="url(#sunburstGrad)" />

  <!-- Sun Rays inside Field -->
  <g stroke="#FDE047" stroke-width="2" opacity="0.6">
    <line x1="210" y1="210" x2="210" y2="95" />
    <line x1="210" y1="210" x2="260" y2="105" />
    <line x1="210" y1="210" x2="160" y2="105" />
    <line x1="210" y1="210" x2="295" y2="135" />
    <line x1="210" y1="210" x2="125" y2="135" />
    <line x1="210" y1="210" x2="315" y2="175" />
    <line x1="210" y1="210" x2="105" y2="175" />
  </g>

  <!-- 7 Golden Stars -->
  <g fill="url(#goldRim)">
    <polygon points="210,102 212,108 218,108 213,112 215,118 210,114 205,118 207,112 202,108 208,108" transform="scale(0.85) translate(37, 20)" />
    <polygon points="210,102 212,108 218,108 213,112 215,118 210,114 205,118 207,112 202,108 208,108" transform="scale(0.85) translate(15, 23)" />
    <polygon points="210,102 212,108 218,108 213,112 215,118 210,114 205,118 207,112 202,108 208,108" transform="scale(0.85) translate(59, 23)" />
    <polygon points="210,102 212,108 218,108 213,112 215,118 210,114 205,118 207,112 202,108 208,108" transform="scale(0.85) translate(-5, 30)" />
    <polygon points="210,102 212,108 218,108 213,112 215,118 210,114 205,118 207,112 202,108 208,108" transform="scale(0.85) translate(79, 30)" />
  </g>

  <!-- Golden Crescent Moon -->
  <path d="M 210 120 A 18 18 0 0 0 210 148 A 14 14 0 0 1 210 126 Z" fill="url(#goldRim)" transform="rotate(-90 210 134)" />

  <!-- Blue House Roof Outline -->
  <path d="M 152 178 L 210 142 L 268 178 L 268 190 L 210 154 L 152 190 Z" fill="#0E4AA8" />

  <!-- Stack of 3 Books at Base -->
  <!-- Book 3 (Bottom Blue) -->
  <rect x="145" y="260" width="130" height="18" rx="4" fill="#1D4ED8" stroke="#0F2D6B" stroke-width="2" />
  <rect x="148" y="263" width="124" height="12" fill="#F8FAFC" />
  <!-- Book 2 (Middle Blue) -->
  <rect x="148" y="244" width="124" height="17" rx="4" fill="#2563EB" stroke="#0F2D6B" stroke-width="2" />
  <rect x="151" y="247" width="118" height="11" fill="#F8FAFC" />
  <!-- Book 1 (Top Green) -->
  <rect x="150" y="228" width="120" height="17" rx="4" fill="#16A34A" stroke="#14532D" stroke-width="2" />
  <rect x="153" y="231" width="114" height="11" fill="#F8FAFC" />

  <!-- Open Book Resting on Top -->
  <path d="M 210 224 C 185 210 155 212 145 220 L 145 200 C 155 192 185 190 210 204 C 235 190 265 192 275 200 L 275 220 C 265 212 235 210 210 224 Z" fill="#FFFFFF" stroke="#0F2D6B" stroke-width="3" />
  <path d="M 210 204 L 210 224" stroke="#0F2D6B" stroke-width="3" />

  <!-- Classic Blue Quill / Feather Pen with Gold Nib -->
  <path d="M 235 145 C 242 165 230 195 206 218 L 202 214 C 220 185 225 160 228 145 Z" fill="#1D4ED8" />
  <polygon points="202,214 206,218 200,224" fill="url(#goldRim)" />
</svg>
